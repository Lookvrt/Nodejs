<div class="container py-4 ">
    <div class="d-flex align-items-center mb-3">
        <h2 class="mb-2">Lista de estudiantes</h2>
        <p *ngIf="cargando">Consultando estudiantes...</p>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    </div>
    <div class="table-responsive" *ngIf="!cargando && !error">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Nota1</th>
                    <th>Nota2</th>
                    <th>Nota3</th>
                    <th>Detalle Estudiante</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let e of estudiante">
                    <td>{{ e.id }}</td>
                    <td>{{ e.nombre }}</td>
                    <td>{{ e.nota1 }}</td>
                    <td>{{ e.nota2 }}</td>
                    <td>{{ e.nota3 }}</td>
                    <td>
                        <a class="btn btn-primary" [routerLink]="['/detalle', e.id]">Detalle</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
