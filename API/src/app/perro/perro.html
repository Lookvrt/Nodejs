<div class="container py-5">
    <div class="text-center mb-5">
        <span class="badge bg-dark mb-3">API REST REAL</span>
        <h1 class="display-5 fw-bold">🐶 Galería de perros</h1>
        <p class="text-muted">Imágenes obtenidas desde Dog CEO API con Angular HttpClient</p>
        <button class="btn btn-primary btn-lg" (click)="cargarPerros()">
            🔄 Mostrar otros perros
        </button>
    </div>
    <div *ngIf="cargando" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">Consultando la API...</p>
    </div>
    <div *ngIf="error" class="alert alert-danger text-center">
        {{ error }}
    </div>
    <div class="row g-4" *ngIf="!cargando && !error">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let perro of perros; let i = index">
            <div class="card border-0 shadow-sm h-100">
                <img [src]="perro" class="card-img-top" style="height: 260px; object-fit: cover;"
                    [alt]="'Perro ' + (i + 1)">
                <div class="card-body text-center">
                    <h5 class="card-title mb-1">Amigo canino {{ i + 1 }}</h5>
                    <small class="text-muted">Cargado desde una API pública</small>
                </div>
            </div>
        </div>
    </div>
</div>
